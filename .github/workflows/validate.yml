name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the skill bundle
        run: bash scripts/build.sh

      - name: Validate skill and repository contracts
        run: bash scripts/validate.sh

      - name: Check installation contracts without host CLIs
        run: python3 scripts/smoke_install.py --structural-only --platform all

      - name: Check canonical references are in sync with shared/ (no drift)
        run: |
          if ! git diff --quiet -- plugins/miodkuj/skills/miodkuj/references/; then
            echo "::error::plugins/miodkuj/skills/miodkuj/references is out of sync with shared/references. Run ./scripts/build.sh and commit the result."
            git --no-pager diff --stat -- plugins/miodkuj/skills/miodkuj/references/
            exit 1
          fi
